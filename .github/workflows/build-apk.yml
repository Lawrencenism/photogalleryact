name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout project
        uses: actions/checkout@v5

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Build web app
      - name: Build web application
        run: npm run build

      # 5. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 6. Confirm Java version
      - name: Check Java version
        run: java -version

      # 7. Synchronize Capacitor with Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 9. Grant execute permission for Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 10. Build Android APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 11. Rename the generated APK
      - name: Rename APK to photogallery.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk photogallery.apk

      # 12. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ionic-photogallery-apk
          path: photogallery.apk